name: Feature request
description: Suggest a scoped improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and API impact
    validations:
      required: true
  - type: textarea
    id: realtime
    attributes:
      label: Realtime-safety and dependency impact
    validations:
      required: true
